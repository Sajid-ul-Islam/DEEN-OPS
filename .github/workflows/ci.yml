name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install ruff

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  test:
    name: Tests & Import Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Compile check (syntax errors)
        run: python -m compileall -q src app.py

      - name: Module import verification
        run: python scripts/check_imports.py

      - name: Run test suite
        run: python -m pytest tests/ -q --disable-warnings

  deploy-check:
    name: Deployment Readiness
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Streamlit config validation
        run: python -c "import toml; toml.load('.streamlit/config.toml'); print('Streamlit config OK')"

      - name: Verify secrets schema is documented
        run: test -f .env.example && echo '.env.example present' || (echo 'Missing .env.example' && exit 1)
